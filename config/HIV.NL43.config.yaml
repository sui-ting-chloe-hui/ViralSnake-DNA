## Snakefile for dna analysis for Christida's CHIKV alignment
## To produce BAM filess for alignment, coverage and counts
## To find mutations 

# run : snakemake -s workflows/Snakefile_main --config proj=CHIKV -n
# run specific files: snakemake -s workflows/Snakefile_main (full path of the specific file) /home/huic/lstm_scratch/local_scratch/DNA/CHIKV/trimmed/CHIKV-1_R1_tr_1P.fq.gz -j1 -p

proj: "HIV.NL43"
proj_dir: "/home/huic/lstm_scratch/local_scratch/ViralSnake-DNA/projects/HIV.NL43"
ref_fasta: "combined_human_HIV.fasta" #HIV_NL43_EnvGFP.fasta
ref_dir: "/home/huic/lstm_data/reference/combined/" # /home/huic/lstm_data/reference/HIV_NL43_EnvGFP/
raw_dir: "/home/huic/lstm_data/P1658.DNA/rawdata"
r1_pattern: "P1658_{sample}_L002_R1_001_1.fq.gz"
r2_pattern: "P1658_{sample}_L002_R2_001_2.fq.gz"
adapter: "/home/huic/miniconda3/share/trimmomatic-0.40-0/adapters/TruSeq3-PE.fa" # Illumina Universal Adapters ## trimmomatic updates quite often in the server, if trimmomatic doesnt work. Check the directory name (ie trimmomatic-0-x-0/)again 
threads: 1024
data_dir: "/home/huic/lstm_data/P1658.DNA"
host_mode: "remove"     # "none" (A), "remove" (B) or "competitive" (C)
host_ref: "Homo_sapiens.GRCh38.dna.toplevel.fa.gz"
host_ref_dir: "/home/huic/lstm_data/reference/hg38/"
min_mapq: 20            # only used by "competitive"
