# Snakefile for dna analysis for Saskia's SARS-CoV-2 alignment 
## To produce BAM filess for alignment, coverage and counts
## To find mutations in clevage sites (PRRAR) and GFP

# run : snakemake -s workflows/Snakefile_main --config proj=SARS2 -n
# run specific files: snakemake -s workflows/Snakefile_main (full path of the specific file) /home/huic/lstm_scratch/local_scratch/DNA/CHIKV/trimmed/CHIKV-1_R1_tr_1P.fq.gz -j1 -p

proj: "SARS2"
proj_dir: "/home/huic/lstm_scratch/local_scratch/ViralSnake-DNA/projects/SARS2"
ref_fasta: "SARS2_GFP_ORF7a.fasta" # interchangeable with SARS2_GFP_ORF7a.fasta / pBACv6_WA1.gb.fasta
ref_dir: "/home/huic/lstm_scratch/local_scratch/ViralSnake-DNA/projects/SARS2/reference/"
raw_dir: "/home/huic/lstm_scratch/local_scratch/ViralSnake-DNA/projects/SARS2/rawdata"
r1_pattern: "{sample}_R1_001.fastq.gz"
r2_pattern: "{sample}_R2_001.fastq.gz"
adapter: "/home/huic/miniconda3/share/trimmomatic-0.40-0/adapters/TruSeq3-PE.fa"  ## trimmomatic updates quite often in the server, if trimmomatic doesnt work. Check the directory name (ie trimmomatic-0-x-0/)again
threads: 1024
host_mode: "remove"     # "none" (A), "remove" (B) or "competitive" (C)
host_ref: "Homo_sapiens.GRCh38.dna.toplevel.fa.gz"
host_ref_dir: "/home/huic/lstm_data/reference/hg38/"
min_mapq: 20            # only used by "competitive"
